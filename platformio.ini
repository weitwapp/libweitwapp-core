[env:test-arduino-uno-hcsr04_01]
; Reads the measured distance from a HC-SCR04 sensor and writes it to serial COM
; PRECONDITION:
; - connect the HC-SR04 sensor to Arduino
; TEST: 
; Measure the distance of an object to the sensor and compare it with the reading on serial COM
; - PASSED: reading equals approx. distance
; - FAILED: reading differes from distance
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    +<libweitwapp/tests/hardware/arduino/hcsr04.test.cpp>
    +<libweitwapp/hardware/hcsr04.c>
    +<libweitwapp/hal/arduino/timer.hal.c>
    +<libweitwapp/hal/arduino/gpio.hal.c>
    +<libweitwapp/hardware/dio.c>
    

    
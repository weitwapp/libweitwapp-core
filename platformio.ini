[env:test-arduino-uno-hardware-dout1]
; ARDUINO on-board LED on PIN13 blinks
; PRECONDITIONS: 
; - DI2 MODE_ACTIVE_HIGH
; TEST: Compile and run the program
; - PASSED: LED blinks 
; - FAILED: 
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    +<libweitwapp/tests/hardware/arduino/dio1.test.cpp>
    +<libweitwapp/hal/arduino/gpio.hal.c>
    +<libweitwapp/hardware/dio.c>
    

[env:test-arduino-uno-hardware-dout2x1]
; Two blinking LEDs connected to an Arduino
; tests libweitwapp/hardware/dio: aktiv-high and aktiv-low
; Precondition:
; - connect LED1 (PIN8) with R to GND -> LIBWEITWAPP_DIO_MODE_ACTIVE_HIGH
; - connect LED2 (PIN4) with R to Vcc -> LIBWEITWAPP_DIO_MODE_ACTIVE_LOW
; Test result:
; - LED1 and LED2 are blinking synchronously
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    +<libweitwapp/tests/hardware/arduino/dio2.test.cpp>
    +<libweitwapp/hal/arduino/gpio.hal.c>
    +<libweitwapp/hardware/dio.c>
    

[env:test-arduino-uno-hardware-dout2x2]
; Two blinking LEDs connected to an Arduino
; tests libweitwapp/hardware/dio: aktiv-high and aktiv-low
; Precondition:
; - connect LED1 (PIN8) with R to GND -> LIBWEITWAPP_DIO_MODE_ACTIVE_HIGH
; - connect LED2 (PIN4) with R to GND -> LIBWEITWAPP_DIO_MODE_ACTIVE_LOW
; Test result:
; - the LEDs flash alternately
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    +<libweitwapp/tests/hardware/arduino/dio2.test.cpp>
    +<libweitwapp/hal/arduino/gpio.hal.c>
    +<libweitwapp/hardware/dio.c>
    

[env:test-arduino-uno-hardware-din1]
; If DI1 or DI2 is active the Arduino on-board LED on PIN 13 is switch on
; PRECONDITIONS for eacht test:
; - DI1 MODE_ACTIVE_HIGH, connect to GND
; - DI2 MODE_ACTIVE_LOW, connect to Vss
; TEST DI1: connect DI1 to Vss
; - PASSED: LED lights up
; - FAILED: 
; TEST DI2: connect DI2 to GND
; - PASSED: LED lights up
; - FAILED: 
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    +<libweitwapp/tests/hardware/arduino/din1.test.cpp>
    +<libweitwapp/hal/arduino/gpio.hal.c>
    +<libweitwapp/hardware/dio.c>
    

[env:test-arduino-uno-hardware_button]
; The Arudino on-board LED is switched on while a button is pressed
; tests libweitwapp/hardware/button
; Precondition:
; - Connect BUTTON1 (PIN8) with R to GND -> LIBWEITWAPP_DIO_MODE_ACTIVE_HIGH
; - Connect BUTTON2 (PIN4) with R to VCC -> LIBWEITWAPP_DIO_MODE_ACTIVE_LOW
; Test result:
; - The Arduino on-board LED is turned one while at least one button is pressed.
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    +<libweitwapp/tests/hardware/arduino/button.test.cpp>
    +<libweitwapp/hal/arduino/gpio.hal.c>
    +<libweitwapp/hal/arduino/timer.hal.c>
    +<libweitwapp/hardware/dio.c>
    +<libweitwapp/hardware/button.c>
    


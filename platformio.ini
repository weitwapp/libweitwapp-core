; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;lib_extra_dirs = libweitwapp/tests
;src_dir = libweitwapp

[env:test-arduino-uno-blink]
; Blinking on-board LED (13) on Arduino
; PRECONDITIONS: none
; TEST: the on-board LED blinks
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    +<libweitwapp/tests/misc/arduino/arduino-blink.test.cpp>

[env:test-arduino-uno-hal-gpio]
; Blinking LED on Arduino
; tests libweitwapp/hal
; Precondition:
; - none
; Test result:
; - the on-board LED blinks
platform = atmelavr
board = uno
framework = arduino
build_flags =
    -D LIBWEITWAPP_HAL_BUILD_ARDUINO   
build_src_filter =
    +<libweitwapp/tests/hal/arduino/gpio.hal.test.cpp>
    +<libweitwapp/hal/arduino/gpio.hal.c>
 
[env:test-arduino-uno-hal-timer]
